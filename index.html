---
layout: page
title: Home
navbar_title: Home
position: 1
---

<style>
/* Main container width */
.posts {
  max-width: 900px;
  margin: 0 auto;
  padding: 0 1rem;
}

/* Flexbox container for each post card */
.post-card {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 2.5rem;
  margin-bottom: 2.5rem;
  padding-bottom: 2.5rem;
  border-bottom: 1px solid #eaeaea;
}

/* Left text block takes up remaining space */
.post-card-content {
  flex: 1;
  min-width: 0;
}

/* Post title styling */
.post-card .post-title {
  font-size: 1.5rem;
  line-height: 1.3;
  margin-top: 0;
  margin-bottom: 0.5rem;
}

/* Post date styling */
.post-card .post-date {
  font-size: 0.9rem;
  color: #666;
  display: block;
}

/* Right image container */
.post-card-image {
  flex-shrink: 0;
  width: 260px;
  height: 150px;
}

.post-card-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 8px;
  display: block;
}

/* Mobile Responsiveness: Stack image above/below on narrow screens */
@media (max-width: 700px) {
  .post-card {
    flex-direction: column-reverse;
    align-items: flex-start;
    gap: 1rem;
  }

  .post-card-image {
    width: 100%;
    height: 200px;
  }
}
</style>

<div class="posts">
  {% for post in site.posts %}
    <article class="post-card">
      
      <!-- Left Column: Title and Date only -->
      <div class="post-card-content">
        <h2 class="post-title">
          <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
        </h2>

        <time class="post-date" datetime="{{ post.date | date_to_xmlschema }}">
          {{ post.date | date: "%B %d, %Y" }}
        </time>
      </div>

      <!-- Right Column: Thumbnail Image -->
      {% if post.image %}
        <div class="post-card-image">
          <a href="{{ post.url | relative_url }}">
            <img src="{{ post.image | relative_url }}" alt="{{ post.title }}" />
          </a>
        </div>
      {% endif %}

    </article>
  {% endfor %}
</div>
