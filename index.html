---
layout: default
---

<div class="posts">
  {% for post in site.posts %}
    <article class="post" style="margin-bottom: 3em;">
      <h2><a href="{{ post.url }}">{{ post.title }}</a></h2>
      <time style="color: #999; font-size: 0.9em;">{{ post.date | date: "%B %d, %Y" }}</time>
      <div class="excerpt" style="margin-top: 0.5em;">
        {{ post.excerpt }}
      </div>
    </article>
  {% endfor %}
</div>
