---
layout: default
---

<!-- Kagami Native Header & Navigation Bar Section -->
<header class="site-header" style="padding: 2.5rem 0; margin-bottom: 3.5rem; border-bottom: 1px solid #f0f0f0; display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 1rem;">
  <div class="site-title-container">
    <h1 style="margin: 0; font-family: 'Bitter', serif; font-size: 2.2rem; font-weight: 700; letter-spacing: -0.02em;">
      <a href="{{ '/' | relative_url }}" style="text-decoration: none; color: #111;">{{ site.title }}</a>
    </h1>
    {% if site.description %}
      <p style="margin: 0.3rem 0 0 0; font-family: 'Source Sans Pro', sans-serif; font-size: 1rem; color: #777; font-style: italic;">{{ site.description }}</p>
    {% endif %}
  </div>

  <nav class="site-nav" style="font-family: 'Source Sans Pro', sans-serif; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; font-size: 0.9rem;">
    <ul style="list-style: none; padding: 0; margin: 0; display: flex; gap: 1.5rem;">
      {% for link in site.navigation %}
        <li>
          <a href="{{ link.url | relative_url }}" style="text-decoration: none; color: #444; transition: color 0.2s ease;" onmouseover="this.style.color='#000'" onmouseout="this.style.color='#444'">{{ link.title }}</a>
        </li>
      {% endfor %}
    </ul>
  </nav>
</header>

<!-- Main Blog Post Feed Grid -->
<div class="posts" style="display: flex; flex-direction: column; gap: 4rem;">
  {% for post in site.posts %}
    <article class="post">
      <h2 class="post-title" style="margin: 0 0 0.5rem 0; font-family: 'Bitter', serif; font-size: 1.75rem; font-weight: 700;">
        <a href="{{ post.url | relative_url }}" style="text-decoration: none; color: #111; transition: opacity 0.2s ease;" onmouseover="this.style.opacity='0.7'" onmouseout="this.style.opacity='1'">{{ post.title }}</a>
      </h2>
      <time class="post-date" datetime="{{ post.date | date_to_xmlschema }}" style="display: block; font-family: 'Source Sans Pro', sans-serif; font-size: 0.85rem; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 1.25rem;">
        {{ post.date | date: "%B %d, %Y" }}
      </time>
      <div class="post-excerpt" style="font-family: 'Source Sans Pro', sans-serif; font-size: 1.1rem; line-height: 1.65; color: #333;">
        {{ post.excerpt }}
      </div>
    </article>
  {% endfor %}
</div>
