---
layout: page
title: Home
---

<!-- Navigation Bar matched to your theme's styling -->
<nav class="site-nav" style="margin-bottom: 2rem;">
  <ul style="list-style: none; padding: 0; margin: 0; display: flex; gap: 1.5rem;">
    {% for link in site.navigation %}
      <li>
        <a href="{{ link.url | relative_url }}">{{ link.title }}</a>
      </li>
    {% endfor %}
  </ul>
</nav>

<!-- Main Blog Feed -->
<div class="posts">
  {% for post in site.posts %}
    <article class="post">
      <h2 class="post-title">
        <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
      </h2>
      <time class="post-date" datetime="{{ post.date | date_to_xmlschema }}">
        {{ post.date | date: "%B %d, %Y" }}
      </time>
      <div class="post-excerpt">
        {{ post.excerpt }}
      </div>
    </article>
  {% endfor %}
</div>
