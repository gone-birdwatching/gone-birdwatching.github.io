---
layout: page
title: Home
navbar_title: Home
position: 1
---

<style>
/* Center the main blog feed container */
.posts {
  max-width: 720px;
  margin: 0 auto;
  padding: 0 1rem;
}

/* Flexbox container for each post card */
.post-card {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 2rem;
  margin-bottom: 3rem;
  padding-bottom: 2rem;
  border-bottom: 1px solid #f0f0f0;
}

/* Left text block takes up remaining space */
.post-card-content {
  flex: 1;
}

/* Right image container */
.post-card-image {
  flex-shrink: 0;
  width: 180px;
  height: 120px;
}

.post-card-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 6px;
  display: block;
}

/* Mobile Responsiveness: Stack image above/below on narrow screens */
@media (max-width: 600px) {
  .post-card {
    flex-direction: column-reverse;
    align-items: flex-start;
    gap: 1rem;
  }

  .post-card-image {
    width: 100%;
    height: 200px;
  }
}
</style>

<div class="posts">
  {% for post in site.posts %}
    <article class="post-card">
      
      <!-- Left Column: Title, Date, Excerpt -->
      <div class="post-card-content">
        <h2 class="post-title" style="margin-top: 0;">
          <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
        </h2>

        <time class="post-date" datetime="{{ post.date | date_to_xmlschema }}">
          {{ post.date | date: "%B %d, %Y" }}
        </time>

        <div class="post-excerpt">
          {{ post.excerpt }}
        </div>
      </div>

      <!-- Right Column: Thumbnail Image -->
      {% if post.image %}
        <div class="post-card-image">
          <a href="{{ post.url | relative_url }}">
            <img src="{{ post.image | relative_url }}" alt="{{ post.title }}" />
          </a>
        </div>
      {% endif %}

    </article>
  {% endfor %}
</div>
